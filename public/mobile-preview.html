<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Full Court Legacy — Mobile Preview</title>
    <style>
      :root {
        color-scheme: dark;
        background: #05070c;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 28px;
        background:
          radial-gradient(circle at 50% 20%, #172641 0, transparent 32%),
          #05070c;
      }

      main {
        display: grid;
        gap: 10px;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: #7c879f;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.12em;
      }

      header strong {
        color: #caff35;
      }

      iframe {
        display: block;
        width: 390px;
        height: 844px;
        border: 1px solid #293248;
        border-radius: 20px;
        background: #070a10;
        box-shadow: 0 30px 80px #000c;
      }

      @media (max-width: 470px) {
        body {
          display: block;
          padding: 0;
        }

        header {
          display: none;
        }

        iframe {
          width: 100vw;
          height: 100dvh;
          border: 0;
          border-radius: 0;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <strong>MOBILE PREVIEW</strong>
        <span>390 × 844</span>
      </header>
      <iframe src="./" title="Full Court Legacy mobile preview"></iframe>
    </main>
  </body>
</html>
